name: test1
description: A new Flutter project.
publish_to: "none"

version: 1.0.6+9

environment:
  sdk: ">=3.1.3 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  animation_image_gallery: ^0.0.1
  animation_list: ^2.2.1
  animator: ^3.3.0
  audioplayers: ^5.2.1
  change_app_package_name: ^1.1.0
  cupertino_icons: ^1.0.2
  flutter_drawing_board: ^1.0.1+2
  flutter_hex_color: ^2.0.0
  flutter_staggered_animations: ^1.1.1
  flutter_tts: ^3.8.3
  google_mobile_ads: ^7.0.0
  highlight_text: ^1.7.0
  level_map: ^0.2.0
  lottie: ^2.7.0
  path_drawing: ^1.0.1
  path_provider: ^2.1.5
  progress_bar_steppers: ^0.0.2+2
  shared_preferences: ^2.5.5
  states_rebuilder: ^6.4.0
  toggle_switch: ^2.1.0
  translator: ^1.0.4+1
  win32: ^5.5.1
  archive: ^3.6.1
  video_player: ^2.11.1
  get: ^4.7.3
  font_awesome_flutter: ^10.5.0
  rive_animated_icon: ^2.1.1
  flutter_staggered_animations_plus: ^1.0.2
  flutter_animate: ^4.5.2
  flutter_confetti_engine: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^2.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.jpg"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/logo.jpg"
    background_color: "#FFFFFF"
    theme_color: "#FFFFFF"
  windows:
    generate: true
    image_path: "assets/images/logo.jpg"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/images/logo.jpg"

flutter:
  uses-material-design: true

  assets:
    - assets/animation_json/
    - assets/images/
    - assets/audio/exam/
    - assets/audio/number/
    - assets/video/
    - assets/images/numbers/
    - assets/images/letter_ar/
    - assets/images/animales/
    - assets/images/exam/
    - assets/images/letter_en/
    - assets/audio/animales/
    - assets/audio/letter_ar/
    - assets/audio/letter_en/

  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto.ttf
          weight: 700
    - family: IconBroken
      fonts:
        - asset: assets\fonts\icons.ttf